server:
  port: 8080

spring:
  application:
    name: nexafort-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/nexafort
    username: postgres
    password: 'postgres'
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minutes

app:
  jwt:
    secret: ${JWT_SECRET:nexafort-super-secret-key-change-in-production-minimum-256-bits}
    access-token-expiration: 900000       # 15 minutes
    refresh-token-expiration: 604800000   # 7 days

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.nexafort: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
